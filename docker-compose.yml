version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: opendesktop-server
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - ./personas:/app/personas
      - ./playbooks:/app/playbooks
    env_file:
      - .env
    environment:
      - SANDBOX_MODE=local
      - OPENDESKTOP_DATA_DIR=/app/data
      - AUTO_PROVISION_FLEET=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  sandbox-node-1:
    build:
      context: ./sandbox-engine
      dockerfile: Dockerfile.sandbox
    container_name: opendesktop-sandbox-1
    ports:
      - "6080:6080"
    environment:
      - SCREEN_WIDTH=1280
      - SCREEN_HEIGHT=800
    profiles:
      - sandbox
    restart: unless-stopped

  dashboard:
    image: nginx:alpine
    container_name: opendesktop-dashboard
    ports:
      - "8888:80"
    volumes:
      - ./client:/usr/share/nginx/html:ro
    restart: unless-stopped

  discord:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: opendesktop-discord
    command: python connectors/discord_bot.py
    env_file:
      - .env
    environment:
      - OPENDESKTOP_API_URL=http://server:8000
    depends_on:
      - server
    profiles:
      - discord
    restart: unless-stopped

  telegram:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: opendesktop-telegram
    command: python connectors/telegram_bot.py
    env_file:
      - .env
    environment:
      - OPENDESKTOP_API_URL=http://server:8000
    depends_on:
      - server
    profiles:
      - telegram
    restart: unless-stopped
