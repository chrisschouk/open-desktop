name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r server/requirements.txt
      - run: pip install pytest pytest-asyncio
      - run: python -c "from server.main import app; from server.gateway import dispatch; from server.skills import list_skills_catalog; from server.tools import list_tools; print('imports ok')"
      - run: pytest tests/ -q
