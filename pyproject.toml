[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opendesktop"
version = "0.2.0"
description = "OpenDesktop — open source desktop agent platform with OpenWorker chat"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "websockets>=11.0.3",
    "aiohttp>=3.8.4",
    "requests>=2.31.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
connectors = ["discord.py>=2.3.0"]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
openworker = "cli.openworker:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["server*", "cli*", "connectors*", "open_desktop*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
